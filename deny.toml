[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-unknown-linux-musl" },
  { triple = "wasm32-wasip2" },
  # The bundle format is byte-identical across platforms and CI proves it on
  # macOS. Without this target in the graph, a macOS-only transitive dependency
  # would go unaudited.
  { triple = "aarch64-apple-darwin" },
]
all-features = true

[advisories]
# Unmaintained, not vulnerable: these crates were folded into zbus 6. They
# reach us only through keyring's Linux secret-service store, and no release of
# keyring or zbus-secret-service-keyring-store uses zbus 6 yet. Remove each
# entry once that store moves to zbus 6 — deny reports an ignore that no longer
# matches, so a stale one does not linger silently.
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; only via keyring's zbus store, which has no zbus 6 release" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; only via keyring's zbus store, which has no zbus 6 release" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; only via keyring's zbus store, which has no zbus 6 release" },
]
# Explicit, not defaulted: the meaning of this key changed across cargo-deny
# releases, and a sandbox runtime should not have its advisory scope quietly
# widen or narrow on a tool upgrade.
unmaintained = "all"

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  # webpki-roots / webpki-root-certs: the Mozilla CA store, shipped as data
  # rather than code. CDLA-Permissive-2.0 governs the certificate set and
  # imposes no obligation on what we redistribute around it.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

# ring and aws-lc-sys carry hand-rolled multi-license text that no
# SPDX expression matches cleanly. Both are fine for Apache-2.0
# distribution; they just need naming explicitly.
[[licenses.exceptions]]
name = "ring"
allow = ["OpenSSL", "ISC", "MIT"]

[[licenses.exceptions]]
name = "aws-lc-sys"
allow = ["OpenSSL", "ISC", "Apache-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

deny = [
  # You committed to rustls. A transitive native-tls pull would put an
  # OpenSSL build dependency into a repo whose selling point is auditability.
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
