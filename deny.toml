[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "wasm32-wasip2" },
]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

# ring and aws-lc-sys carry hand-rolled multi-license text that no
# SPDX expression matches cleanly. Both are fine for Apache-2.0
# distribution; they just need naming explicitly.
[[licenses.exceptions]]
name = "ring"
allow = ["OpenSSL", "ISC", "MIT"]

[[licenses.exceptions]]
name = "aws-lc-sys"
allow = ["OpenSSL", "ISC", "Apache-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

deny = [
    # You committed to rustls. A transitive native-tls pull would put an
    # OpenSSL build dependency into a repo whose selling point is auditability.
    { name = "openssl-sys" },
    { name = "native-tls" },
]

skip-tree = [
    { name = "windows-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[sources.allow-org]
github = ["clwdrun", "bytecodealliance"]