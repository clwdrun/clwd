[workspace]
resolver = "2"
members = ["crates/*"]
# A wasm32-wasip2 guest built as a test fixture, not a workspace member: it
# targets a different architecture and has its own lockfile.
# Templates are shipped projects, not workspace members: they target
# wasm32-wasip2, they are copied out by `clwd init`, and they must build exactly
# as an author receives them.
exclude = ["crates/runtime/tests/fixtures/guest", "templates/minimal", "templates/notes", "templates/webhook"]
# clwd-agent is musl-only and built via its own CI job / `-p` flag,
# not as part of a plain `cargo build --workspace`.
default-members = [
  "crates/bundle",
  "crates/cli",
  "crates/sdk",
  "crates/runtime",
]

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/clwdrun/clwd"

[workspace.dependencies]
# shared
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
# Already in the tree via tokio, so a direct dependency adds nothing to the
# graph. Taken for the guard's type, not its speed: `parking_lot::MutexGuard`
# is `!Send`, so holding one across an `.await` in an `#[async_trait]` method
# is a compile error rather than a comment asking nobody to do it.
parking_lot = "0.12"

# clwd-cli
# Terminal-drawing features (color, suggestions) are off here and added back
# by clwd-cli's `terminal` feature, so the library half builds without them.
clap = { version = "4.6.6", default-features = false, features = [
  "derive",
  "std",
  "help",
  "usage",
  "error-context",
] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls",
  "json",
] }
keyring = "4.1.6"
# A response body that is not UTF-8 — an image, say — cannot go into JSON as a
# string. `clwd run --json` emits `body_base64` instead, so exactly one of the
# two keys is always present and a caller checks which.
base64 = "0.22"
# Wipes a secret's bytes when the value is dropped. Not defence against a
# determined attacker with the machine — an OS can page memory out and a
# compiler can elide a copy — but it shortens the window where a value sits in
# a freed allocation, and it costs one derive.
zeroize = { version = "1", features = ["derive"] }
indicatif = "0.18.6"
futures-core = "0.3.34"

# intra-workspace
clwd-bundle = { version = "0.0.3", path = "crates/bundle" }
clwd-runtime = { version = "0.0.3", path = "crates/runtime" }
clwd-sdk = {version = "0.0.3", path = "crates/sdk" }
# clwd-runtime (trait surface — no backend required)
http = "1"
bytes = "1"
http-body-util = "0.1"

# clwd-cli (clwd dev — long-lived local HTTP server + file watcher)
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1"] }
notify = "8"

# clwd-bundle
blake3 = { version = "1", default-features = false }
toml = "1"
unicode-normalization = "0.1"

# clwd-sdk
wit-bindgen = "0.60.0"

# clwd-runtime (wasm backend)
#
# Default features off, with explicit lists. Every wasmtime feature compiled in
# is a class of advisory that can reach a guest: the defaults include
# `component-model-async`, which turns the async component model on at runtime
# and was the path for GHSA-32h6-97mm-8q3c (a guest-controlled native stack
# overflow). Nothing here uses async components, GC, threads, the pooling
# allocator, WASIp1 or WASIp3, so none of them are built. Adding a feature back
# is a security decision: say which advisory classes it reopens.
wasmtime = { version = "48.0.5", default-features = false, features = [
  "runtime",
  "std",
  "cranelift",
  "parallel-compilation",
  "component-model",
  "async",
  "backtrace",
  "addr2line",
] }
wasmtime-wasi = { version = "48.0.5", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "48.0.5", default-features = false, features = [
  "p2",
  "default-send-request",
] }

# clwd-runtime (microvm backend) — no maintained firecracker-rs wrapper,
# so we drive the Firecracker API socket directly.
hyper = { version = "1", features = ["full"] }
hyperlocal = "0.9"
tokio-vsock = "0.7.2"
rtnetlink = "0.23.0"
seccompiler = "0.5.0"
landlock = "0.4"
nix = { version = "0.31.3", features = ["process", "signal", "mount"] }
rustix = { version = "1.1.4", features = ["fs", "net", "process"] }
socket2 = { version = "0.6.5", features = ["all"] }
# The host<->guest control protocol (#22), chosen over `rkyv`: `postcard` plus
# `zerocopy` keeps zero-copy reads safe by checked conversion, with no
# validation machinery to audit and no archive format bloating a musl PID 1.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
zerocopy = { version = "0.8.56", features = ["derive"] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies only. An unoptimized wasmtime compiles guest components an order
# of magnitude slower, which is most of the wasm suite's wall time — measured
# 18.5s -> 4.0s on `wasm_lifecycle`. Workspace code stays at opt-level 0 above,
# so the incremental edit-test loop is untouched.
opt-level = 3
debug = false

[profile.dev.build-override]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"
debug = "line-tables-only"

[profile.release.build-override]
opt-level = 3