[workspace]
resolver = "2"
members = ["crates/*"]
# A wasm32-wasip2 guest built as a test fixture, not a workspace member: it
# targets a different architecture and has its own lockfile.
exclude = ["crates/runtime/tests/fixtures/guest"]
# clwd-agent is musl-only and built via its own CI job / `-p` flag,
# not as part of a plain `cargo build --workspace`.
default-members = [
  "crates/bundle",
  "crates/cli",
  "crates/sdk",
  "crates/runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/clwdrun/clwd"

[workspace.dependencies]
# shared
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

# clwd-cli
# Terminal-drawing features (color, suggestions) are off here and added back
# by clwd-cli's `terminal` feature, so the library half builds without them.
clap = { version = "4.6.6", default-features = false, features = [
  "derive",
  "std",
  "help",
  "usage",
  "error-context",
] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls",
  "json",
] }
keyring = "4.1.6"
indicatif = "0.18.6"
futures-core = "0.3.34"

# intra-workspace
clwd-bundle = { version = "0.1.0", path = "crates/bundle" }

# clwd-runtime (trait surface — no backend required)
http = "1"
bytes = "1"
http-body-util = "0.1"

# clwd-bundle
blake3 = { version = "1", default-features = false }
toml = "1"
unicode-normalization = "0.1"

# clwd-sdk
wit-bindgen = "0.60.0"

# clwd-runtime (wasm backend)
wasmtime = "48.0.1"
wasmtime-wasi = "48.0.1"
wasmtime-wasi-http = "48.0.1"

# clwd-runtime (microvm backend) — no maintained firecracker-rs wrapper,
# so we drive the Firecracker API socket directly.
hyper = { version = "1", features = ["full"] }
hyperlocal = "0.9"
tokio-vsock = "0.7.2"
rtnetlink = "0.23.0"
seccompiler = "0.5.0"
landlock = "0.4"
nix = { version = "0.31.3", features = ["process", "signal", "mount"] }
