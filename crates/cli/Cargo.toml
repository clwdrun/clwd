[package]
name = "clwd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for deploying and sharing apps on clwd"

# The library is the API `clwd mcp serve` (#32) and the integration tests call.
# It must stay silent: command functions return typed values, and every byte
# that reaches a terminal is written by the binary.
[lib]
name = "clwd_cli"
path = "src/lib.rs"

[[bin]]
name = "clwd"
path = "src/main.rs"

[features]
default = ["terminal", "run"]
# Everything that draws to a TTY. `cargo build -p clwd-cli --lib
# --no-default-features` is the assertion that the library half does not.
terminal = ["dep:indicatif", "clap/color", "clap/suggestions"]
# `clwd run` — the sandbox, and the one door through which a runtime backend is
# allowed to reach the CLI.
#
# On by default so `cargo build -p clwd-cli` yields a binary whose headline
# command works. Off under `--no-default-features`, which is what the `cli-deps`
# gate builds to assert the library half still carries no wasmtime. Mirrors
# `terminal`: the capability is a feature, and its absence is testable.
#
# Before this existed the rule was "clwd-cli must never pull in wasmtime". It is
# now "only through here" — a narrower claim, and the only one that can be true
# once `run` has to execute something.
run = ["dep:clwd-runtime", "dep:http", "dep:tracing"]

[dependencies]
clap = { workspace = true }
futures-core = { workspace = true }
indicatif = { workspace = true, optional = true }
reqwest = { workspace = true }

# Behind `run`. The `cli-deps` gate asserts both directions: absent without the
# feature, present with it.
clwd-runtime = { workspace = true, optional = true, features = ["wasm"] }
# Not optional, and not behind `run`. `clwd build` authors a bundle and `clwd
# run` reads one, so the format is core to the CLI rather than to any one
# command. It carries no runtime — the `cross-platform-digest` job asserts that
# `clwd-bundle`'s tree contains no wasmtime, tokio or clwd-runtime — so an
# unconditional dependency here cannot smuggle a backend past `cli-deps`.
clwd-bundle = { workspace = true }
# Not optional. `clwd secrets` encodes values with it and runs no sandbox, so
# gating it on `run` would put a feature that carries wasmtime in front of a
# command that only touches a file.
base64 = { workspace = true }
# `clwd_runtime::Request` is an alias for `http::Request<Body>`; building one
# needs the concrete type.
http = { workspace = true, optional = true }
# For failures that must not change the exit code but must not vanish either —
# a sandbox that would not stop, for instance.
tracing = { workspace = true, optional = true }
toml = { workspace = true }
zeroize = { workspace = true }
keyring = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Doc generation only. `tests/error_table.rs` builds docs/error-codes.md from
# all three code catalogues and cannot reach runtime's or bundle's otherwise.
#
# Dev-dependencies are excluded from `cargo tree -e normal`, which is what the
# `cli-deps` gate inspects, so "clwd-cli must not grow a runtime backend" still
# holds — and clwd-runtime with no features pulls no backend anyway.
clwd-runtime = { workspace = true }
clwd-bundle = { workspace = true }
