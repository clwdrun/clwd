[package]
name = "clwd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for deploying and sharing apps on clwd"

# The library is the API `clwd mcp serve` (#32) and the integration tests call.
# It must stay silent: command functions return typed values, and every byte
# that reaches a terminal is written by the binary.
[lib]
name = "clwd_cli"
path = "src/lib.rs"

[[bin]]
name = "clwd"
path = "src/main.rs"

# Needs the panicking tool, so only built when that feature is on;
# `just mcp-panic` and CI run it.
[[test]]
name = "mcp_panic"
path = "tests/mcp_panic.rs"
required-features = ["mcp-test-panic"]

[features]
default = ["terminal", "run", "mcp"]
# Everything that draws to a TTY. `cargo build -p clwd-cli --lib
# --no-default-features` is the assertion that the library half does not.
terminal = ["dep:indicatif", "clap/color", "clap/suggestions"]
# `clwd run` — the sandbox, and the one door through which a runtime backend is
# allowed to reach the CLI.
#
# On by default so `cargo build -p clwd-cli` yields a binary whose headline
# command works. Off under `--no-default-features`, which is what the `cli-deps`
# gate builds to assert the library half still carries no wasmtime. Mirrors
# `terminal`: the capability is a feature, and its absence is testable.
#
# Before this existed the rule was "clwd-cli must never pull in wasmtime". It is
# now "only through here" — a narrower claim, and the only one that can be true
# once `run` has to execute something.
# `dev` (the long-lived local server + watcher) links the runtime like `run`,
# so its server and watcher deps ride the same feature rather than a second one.
run = [
    "dep:clwd-runtime",
    "dep:http",
    "dep:tracing",
    "dep:async-trait",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:notify",
    "dep:bytes",
    "dep:tracing-subscriber",
]
# `clwd mcp serve` (#32): the MCP server over stdio. Its subscriber writes
# rmcp's `tracing` events to stderr, and on Unix it kills a cancelled build's
# whole process group, not just cargo.
mcp = ["dep:rmcp", "dep:tokio-util", "dep:tracing", "dep:tracing-subscriber", "dep:rustix"]
# Test-only: adds a tool that panics, so a test can show a panic never reaches
# stdout. `just mcp-release-bare` asserts a release build does not contain it.
mcp-test-panic = ["mcp"]

[dependencies]
clap = { workspace = true }
futures-core = { workspace = true }
indicatif = { workspace = true, optional = true }
reqwest = { workspace = true }

# Behind `run`. The `cli-deps` gate asserts both directions: absent without the
# feature, present with it.
clwd-runtime = { workspace = true, optional = true, features = ["wasm"] }
# Not optional, and not behind `run`. `clwd build` authors a bundle and `clwd
# run` reads one, so the format is core to the CLI rather than to any one
# command. It carries no runtime — the `cross-platform-digest` job asserts that
# `clwd-bundle`'s tree contains no wasmtime, tokio or clwd-runtime — so an
# unconditional dependency here cannot smuggle a backend past `cli-deps`.
clwd-bundle = { workspace = true }
# Not optional. `clwd secrets` encodes values with it and runs no sandbox, so
# gating it on `run` would put a feature that carries wasmtime in front of a
# command that only touches a file.
base64 = { workspace = true }
# `clwd_runtime::Request` is an alias for `http::Request<Body>`; building one
# needs the concrete type.
http = { workspace = true, optional = true }
# `clwd dev`'s long-lived local server and file watcher. Behind `run`: `dev`
# links the runtime exactly as `run` does, and a build without a sandbox has no
# server to run. `hyper` is already in the tree via `reqwest`, so promoting it
# to a direct dependency adds nothing.
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# Binary-side only: renders `dev`'s `tracing` events to stderr. The library
# emits events; `main.rs` installs the subscriber.
tracing-subscriber = { workspace = true, optional = true }
# For failures that must not change the exit code but must not vanish either —
# a sandbox that would not stop, for instance.
tracing = { workspace = true, optional = true }
# Implementing clwd-runtime's `SecretStore` needs the same attribute the trait
# was declared with. Behind `run` with the trait it serves.
async-trait = { workspace = true, optional = true }
toml = { workspace = true }
zeroize = { workspace = true }
# Optional, and off. #27 measured it and chose a file store instead: it adds 56
# crates to this workspace including a whole second async executor beside the
# tokio the CLI already runs, and on a headless Linux box there is no D-Bus
# session for it to reach.
#
# It stays declared because it is the intended opt-in backend for a laptop, and
# `optional = true` gives it a feature to be enabled by without costing every
# build that does not want it. Removing it would lose that decision; making it
# unconditional would charge everyone for a backend nobody currently uses.
keyring = { workspace = true, optional = true }
tokio = { workspace = true }
rmcp = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }

[dev-dependencies]
# Doc generation only. `tests/error_table.rs` builds docs/error-codes.md from
# all three code catalogues and cannot reach runtime's or bundle's otherwise.
#
# Dev-dependencies are excluded from `cargo tree -e normal`, which is what the
# `cli-deps` gate inspects, so "clwd-cli must not grow a runtime backend" still
# holds — and clwd-runtime with no features pulls no backend anyway.
#
# `test-util` adds no dependency; it exposes `clwd_runtime::error::samples()`,
# which the same test uses to hold the recovery column to `retryable()`.
clwd-runtime = { workspace = true, features = ["test-util"] }
clwd-bundle = { workspace = true }
