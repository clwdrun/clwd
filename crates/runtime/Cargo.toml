[package]
name = "clwd-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sandbox trait plus wasmtime and Firecracker backends"

[features]
default = []
# A scripted backend for exercising the lifecycle with no wasmtime and no KVM.
# #20 builds its conformance suite on this rather than replacing it.
test-util = []
# The backend conformance suite's harness surface (`conformance` module). Pulls
# no dependencies: it is the trait plus the requirement list. The suite tests
# themselves also need `wasm` (and later `microvm`) for the backend arms.
conformance = []
wasm = [
  "dep:wasmtime",
  "dep:wasmtime-wasi",
  "dep:wasmtime-wasi-http",
  "dep:http-body-util",
  "dep:hyper",
]
microvm = [
  "dep:hyper",
  "dep:hyperlocal",
  "dep:tokio-vsock",
  "dep:rtnetlink",
  "dep:seccompiler",
  "dep:landlock",
  "dep:nix",
  # Declared ahead of #21/#22/#23 so the driver, the agent protocol and the
  # jailer work add code rather than dependencies. Gated with the rest of the
  # backend: none of these may reach the `Sandbox` trait surface, which the
  # `trait-deps` gate asserts with no features on. All four are already in the
  # tree transitively, so this adds no crate to `Cargo.lock`.
  "dep:rustix",
  "dep:socket2",
  "dep:postcard",
  "dep:zerocopy",
]

[dependencies]
clwd-bundle = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures-core = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }

http-body-util = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wasmtime-wasi-http = { workspace = true, optional = true }

hyper = { workspace = true, optional = true }
hyperlocal = { workspace = true, optional = true }
tokio-vsock = { workspace = true, optional = true }
rtnetlink = { workspace = true, optional = true }
seccompiler = { workspace = true, optional = true }
landlock = { workspace = true, optional = true }
nix = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
zerocopy = { workspace = true, optional = true }

[dev-dependencies]
trybuild = "1"

# The compile-fail cases below need the scripted backend, and a feature cannot
# be enabled for dev-dependencies alone — so the crate depends on itself with
# `test-util` on, which applies to test targets only.
clwd-runtime = { path = ".", features = ["test-util"] }
