name: cd

# Two independent release trains, because they have different cadences.
#   v*            -> the clwd CLI: check the tag builds
#   clwd-sdk-v*   -> publish clwd-sdk to crates.io
#   dispatch      -> cut a GitHub Release, deliberately
#
# The SDK ships on its own cadence and is consumed by the private platform
# repo via a tag-pinned git dependency, so a breaking SDK change needs a
# version bump and a tag — not just a merge to main.
#
# **Pushing a `v*` tag does NOT cut a Release.** Most `v*` tags are seam pins
# that exist so `platform` has a ref to depend on, and a tag is a ref while a
# Release is an announcement. Cutting one on every pin put `v0.0.1` at the top
# of the Releases list marked "Latest", with auto-generated notes — invisible
# while the repo is private and retroactively public the moment it is not.
#
# So a Release is `workflow_dispatch` only: a deliberate act with a tag named
# explicitly. That encodes the distinction rather than asking anyone to
# remember it, and it does not guess at a version scheme that is not settled —
# a `v0.0.*`-shaped exclusion would have, and would be annoying to unpick.
on:
  push:
    tags:
      - "v*"
      - "clwd-sdk-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to cut a Release from, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Bump with ci.yml's copy; the digest is of the release's linux-musl archive.
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f

jobs:
  # A tag is a promise about what the code says. Check it before shipping —
  # a mismatch here is cheap, and expensive once it is on crates.io forever.
  #
  # **This job looks removable and is not.** Its only visible output is "the tag
  # is valid", which reads like a no-op to someone tidying up. What it actually
  # does is three things nothing else does: it resolves the tag from *either*
  # trigger, so a dispatched Release is validated exactly as a pushed tag is; it
  # refuses a tag that does not exist, because a Release names a ref rather than
  # creating one; and it decides which release train a tag belongs to, which is
  # what keeps a seam pin from reaching crates.io.
  #
  # The trains are separated by tag shape, not by job condition alone: `v0.0.2`
  # matches `v*` and sets `TRAIN=cli`, while only `clwd-sdk-v*` sets `TRAIN=sdk`.
  # Delete this job and both properties go with it.
  verify-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      train: ${{ steps.v.outputs.train }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - id: v
        # The tag reaches the script through the environment, not through `${{ }}`
        # interpolation. A dispatch input needs write access to set, so this is
        # not an untrusted string — but interpolating any input straight into a
        # shell is the shape of a script injection, and it costs nothing to not
        # write it that way.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          [[ -n "$TAG" ]] || TAG="${GITHUB_REF#refs/tags/}"

          # A Release names a ref that already exists; tag first, release second.
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::no tag ${TAG}"
            exit 1
          fi
          if [[ "$TAG" == clwd-sdk-v* ]]; then
            TRAIN=sdk
            VERSION="${TAG#clwd-sdk-v}"
            MANIFEST=$(cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json,sys;print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="clwd-sdk"))')
          else
            TRAIN=cli
            VERSION="${TAG#v}"
            MANIFEST=$(cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json,sys;print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="clwd-cli"))')
          fi
          if [[ "$VERSION" != "$MANIFEST" ]]; then
            echo "::error::tag $TAG claims $VERSION but the manifest says $MANIFEST"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "train=$TRAIN" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ok: $TAG matches manifest ($TRAIN train)"

  # Never ship something that did not pass CI — by asking CI, not by redoing it.
  #
  # This job used to rerun fmt, clippy, tests and deny on the tagged commit:
  # about 25 minutes to re-derive a result CI had already recorded for that
  # exact commit. It now checks three things, each fatal on its own:
  #
  #   (a) the tagged commit is an ancestor of origin/main, so a tag cannot ship
  #       a commit that never landed;
  #   (b) the `ci` workflow succeeded on that exact SHA, queried from the API —
  #       not a later commit, not the branch;
  #   (c) a fresh advisories check, the one input that can change after CI ran
  #       without any commit changing.
  #
  # (a) and (b) are evaluated and reported together before failing, so a
  # refused tag says everything that is wrong with it at once.
  gate:
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify-tag.outputs.tag }}
          fetch-depth: 0

      # Invariant: SC-5.
      - name: the tagged commit is on main, and ci passed on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          sha=$(git rev-parse HEAD)
          fail=0

          git fetch --no-tags --quiet origin main
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "ok: (a) $sha is an ancestor of origin/main"
          else
            echo "::error::(a) $sha is not an ancestor of origin/main"
            fail=1
          fi

          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=success" \
                   --jq '.total_count') || runs="query failed"
          if [[ "$runs" =~ ^[1-9][0-9]*$ ]]; then
            echo "ok: (b) $runs successful ci run(s) on $sha"
          else
            echo "::error::(b) no successful ci run on $sha (${runs})"
            fail=1
          fi

          exit "$fail"

      # Release binary, checksum-verified; the same pin and digest as ci.yml.
      - name: install cargo-deny
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$name.tar.gz"
          echo "${CARGO_DENY_SHA256}  $name.tar.gz" | sha256sum --check --strict
          tar -xzf "$name.tar.gz" "$name/cargo-deny"
          sudo install -m 0755 "$name/cargo-deny" /usr/local/bin/cargo-deny
          rm -rf "$name" "$name.tar.gz"
          cargo-deny --version

      # Invariant: SC-5.
      - name: (c) advisories, fresh
        run: cargo deny check --hide-inclusion-graph advisories

  # A build check, not a release pipeline. Kept on tag push because knowing a
  # tag still compiles for both targets is worth the minutes; the packaging and
  # artifact upload moved to the `release` job, which is the only thing that
  # needs them. Seam pins are frequent and Actions minutes are billed.
  build-cli:
    if: github.event_name == 'push' && needs.verify-tag.outputs.train == 'cli'
    needs: [verify-tag, gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          # Static build: runs on any distro without a glibc version dance.
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - name: musl linker
        if: endsWith(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build -p clwd-cli --release --locked --target ${{ matrix.target }}

  # Cutting a Release is deliberate, never a side effect of pushing a ref.
  # See the note at the top of this file and the seam section in
  # docs/development.md.
  # Invariant: SC-6.
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [verify-tag, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      # The tag is an input rather than `GITHUB_REF`, so the operator names what
      # they are releasing instead of it being inferred from how the job was
      # triggered.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - run: rustup show active-toolchain
      - name: musl linker
        if: endsWith(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build -p clwd-cli --release --locked --target ${{ matrix.target }}

      # NOTE for #26: this packages the binary as built. `[profile.release]` sets
      # `strip = "none"` with `debug = "line-tables-only"`, which #25 measured at
      # 124.5 MB against 22.1 MB stripped — roughly 100 MB of debug information
      # per artifact, per target. Whether to strip here or change the profile is
      # #26's call with `cargo-dist`; this comment exists so that arrives as a
      # known state rather than a surprise.
      - name: package
        env:
          V: ${{ needs.verify-tag.outputs.version }}
        run: |
          NAME="clwd-${V}-${{ matrix.target }}"
          install -Dm755 "target/${{ matrix.target }}/release/clwd" "dist/${NAME}/clwd"
          cp LICENSE README.md "dist/${NAME}/"
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: clwd-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  # Invariant: SC-6.
  cut-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [verify-tag, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: cut release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          V: ${{ needs.verify-tag.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "clwd $V" \
            --generate-notes \
            artifacts/*.tar.gz artifacts/*.sha256

  # Still on tag push, deliberately: `clwd-sdk-v*` is an explicit release tag,
  # never a seam pin — a `v*` pin sets `TRAIN=cli` and skips this job entirely,
  # so the concern that motivated moving `release` to dispatch does not apply.
  #
  # A crates.io publish is irreversible in a way a Release is not (yank hides a
  # version, it does not remove it), and the designed gate for that is the
  # `crates-io` environment's approval rules — not the trigger. Neither the
  # environment nor `CARGO_REGISTRY_TOKEN` is configured today, so this job
  # currently fails closed at `require token` before reaching `cargo publish`.
  # None of the three crate names are reserved on crates.io yet either.
  publish-sdk:
    if: github.event_name == 'push' && needs.verify-tag.outputs.train == 'sdk'
    needs: [verify-tag, gate]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain

      # Fail loudly rather than skipping. A release that silently publishes
      # nothing is worse than one that stops and says why.
      - name: require token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set on the crates-io environment"
            exit 1
          fi

      - name: dry run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p clwd-sdk --locked --dry-run

      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p clwd-sdk --locked
