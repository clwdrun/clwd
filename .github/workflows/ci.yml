name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. No job here needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # Bump these two together. The digest is of
  # gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, taken from the release's own
  # checksums file and confirmed against the downloaded archive.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # Same rule: the digest is of
  # cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz, from the
  # release's own .sha256 file and confirmed against the downloaded archive.
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f

jobs:
  # Mirrors `just check`. If these two drift, the gate is a lie.
  gate:
    runs-on: ubuntu-latest
    steps:
      # Full history: the secret scan below walks every commit, and a shallow
      # clone would silently scan almost nothing.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # First, because it is seconds and a leaked credential invalidates
      # everything downstream. GitHub's own secret scanning and push protection
      # are Advanced Security features, unavailable on a private repository, so
      # this replaces them.
      #
      # Installed from the release tarball rather than via gitleaks-action,
      # which requires a paid licence key on organization accounts. A pinned
      # binary is also less supply chain than a third-party action, and runs
      # the identical command `just secrets` runs locally.
      #
      # Downloaded from the pinned release and checksum-verified before it is
      # unpacked. A secret scanner installed over an unverified pipe is a
      # supply-chain hole in the tool whose whole job is to close one: whatever
      # the download produced would run with sudo, against full history, and
      # report clean. `set -euo pipefail` so a failed download cannot fall
      # through to the next line.
      # Invariant: SC-4.
      - name: install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" gitleaks
          gitleaks version

      # Invariant: SC-3.
      - name: secrets
        run: gitleaks detect --no-banner --redact --exit-code 1

      # `clwd build` strips custom sections with this, and the test that the
      # optimiser actually shrinks anything is unconditional. Without it here
      # that test would have to skip — and CI is the one place it must not,
      # since a local machine that happens to have the tool would pass while
      # the gate quietly checked nothing.
      - name: install wasm-tools
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: wasm-tools@1.257.1

      # rustup honours rust-toolchain.toml on first invocation, installing the
      # pinned version with its profile, components and targets. No third-party
      # toolchain action needed — fewer actions is less supply chain in a repo
      # whose selling point is auditability.
      - run: rustup show active-toolchain

      # An exact-key cache missed on every lockfile change, so any dependency
      # bump rebuilt the whole tree cold in every job. rust-cache falls back to
      # the newest cache for the same job and toolchain when the lockfile
      # differs, and prunes artifacts the current lockfile no longer uses before
      # saving, so a restored cache does not grow without limit. The rustc
      # version is part of its key, so a toolchain pin bump still starts clean.
      #
      # Saved from `main` only. A pull request restores `main`'s cache and
      # leaves it alone: per-PR copies of a 1 GB target filled the repository's
      # cache quota and evicted the ones every run depends on.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: test
        run: cargo test --workspace

      # The library half of clwd-cli must stay silent. `clwd mcp serve` (#32)
      # calls these functions in-process and emits nothing on stdout but
      # JSON-RPC; a stray print corrupts that stream intermittently, under load
      # only. main.rs is excluded because printing is precisely its job.
      - name: no print macro in the clwd-cli library surface
        run: |
          if grep -rn --include='*.rs' -E '\b(print!|println!|eprint!|eprintln!)' \
               crates/cli/src/lib.rs crates/cli/src/cli.rs \
               crates/cli/src/commands/ crates/cli/src/error.rs; then
            echo "::error::print macro in the clwd-cli library surface — see issue #14"
            exit 1
          fi
          echo "ok: no print macro in the clwd-cli library surface"

      # Mirrors `just stdout-owners`: exactly two places take stdout, both in
      # main.rs, each behind an `#[expect]` naming which owner it is.
      # Invariant: MCP-1.
      - name: stdout has exactly two owners
        run: |
          sites=$(grep -rn --include='*.rs' 'clippy::disallowed_methods' crates/cli)
          count=$(printf '%s\n' "$sites" | grep -c . || true)
          if [ "$count" -ne 2 ] || printf '%s\n' "$sites" | grep -qv '^crates/cli/src/main.rs:'; then
            echo "::error::expected exactly 2 disallowed_methods expectations, both in main.rs; found $count"
            printf '%s\n' "$sites"
            exit 1
          fi
          echo "ok: stdout has exactly two owners, both in main.rs"

      # Mirrors `just spawn-confined`: one subprocess constructor, which closes
      # stdin and drops every CLWD_* variable.
      # Invariant: CLI-3.
      - name: one subprocess constructor
        run: |
          sites=$(grep -rn --include='*.rs' -E '\bCommand::new\(' crates/cli/src)
          if [ "$(printf '%s\n' "$sites" | grep -c .)" -ne 1 ] \
             || ! printf '%s\n' "$sites" | grep -q '^crates/cli/src/build/process.rs:'; then
            echo "::error::a subprocess is constructed outside build::process::command"
            printf '%s\n' "$sites"
            exit 1
          fi
          echo "ok: one subprocess constructor, in build::process"

      # Mirrors `just stdin-readers`: stdin is read in exactly two places,
      # both in main.rs, so nothing prompts and nothing takes the protocol.
      # Invariant: CLI-10.
      - name: stdin has exactly two readers
        run: |
          sites=$(grep -rn --include='*.rs' -E '\bstdin\(\)' crates/cli/src)
          if [ "$(printf '%s\n' "$sites" | grep -c .)" -ne 2 ] \
             || printf '%s\n' "$sites" | grep -qv '^crates/cli/src/main.rs:'; then
            echo "::error::expected exactly 2 stdin readers, both in crates/cli/src/main.rs"
            printf '%s\n' "$sites"
            exit 1
          fi
          echo "ok: stdin has exactly two readers, both in main.rs"

      # Mirrors `just wasmtime-features`: the exact reviewed feature set.
      # Invariant: RT-16.
      - name: wasmtime builds with exactly the reviewed features
        run: |
          set -uo pipefail
          expected='wasmtime feature "addr2line"
          wasmtime feature "async"
          wasmtime feature "backtrace"
          wasmtime feature "component-model"
          wasmtime feature "cranelift"
          wasmtime feature "parallel-compilation"
          wasmtime feature "runtime"
          wasmtime feature "std"
          wasmtime feature "wasmtime-jit-icache-coherence"
          wasmtime feature "wasmtime-unwinder"
          wasmtime-wasi feature "p2"
          wasmtime-wasi-http feature "default-send-request"
          wasmtime-wasi-http feature "p2"'
          expected=$(printf '%s\n' "$expected" | sed 's/^ *//' | sort -u)
          actual=$(for c in wasmtime wasmtime-wasi wasmtime-wasi-http; do
            cargo tree --workspace --all-features -e features -i "$c" | grep -oE "$c feature \"[a-z0-9-]+\""
          done | sort -u)
          if [ "$actual" != "$expected" ]; then
            echo "::error::the wasmtime feature set changed (< expected, > actual)"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
            exit 1
          fi
          echo "ok: wasmtime builds with exactly the reviewed features"

      # Mirrors `just invariants`: docs/security/invariants.md and the
      # `Invariant: ID` references in tests, recipes and steps agree.
      - name: every invariant is enforced, and every reference exists
        run: |
          set -uo pipefail
          doc=docs/security/invariants.md
          ids=$(grep -oE '^### [A-Z]+-[0-9]+' "$doc" | cut -d' ' -f2)
          refs=$(grep -rhoE --exclude-dir=target --exclude-dir=.git 'Invariant: [A-Z]+-[0-9]+' \
                   crates templates justfile .github | cut -d' ' -f2 | sort -u)
          if [ -z "$ids" ] || [ -z "$refs" ]; then
            echo "::error::found no invariants or no references; this check would prove nothing"
            exit 1
          fi
          fail=0
          dups=$(printf '%s\n' "$ids" | sort | uniq -d)
          [ -n "$dups" ] && { echo "::error::invariants defined twice: $dups"; fail=1; }
          unenforced=$(comm -23 <(printf '%s\n' "$ids" | sort -u) <(printf '%s\n' "$refs"))
          [ -n "$unenforced" ] && { echo "::error::invariants nothing enforces:" $unenforced; fail=1; }
          unknown=$(comm -13 <(printf '%s\n' "$ids" | sort -u) <(printf '%s\n' "$refs"))
          [ -n "$unknown" ] && { echo "::error::references to undefined invariants:" $unknown; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "ok: $(printf '%s\n' "$ids" | grep -c .) invariants, each enforced, and no unknown reference"

      # Mirrors `just mcp-panic`: the panic test needs the test-only tool.
      - name: mcp panic test
        run: cargo test -p clwd-cli --features mcp-test-panic --test mcp_panic

      # Mirrors `just mcp-release-bare`: the panicking tool never ships.
      # Invariant: MCP-6.
      - name: release binary has no test-only tool
        run: |
          cargo build -p clwd-cli --release --bin clwd
          if ! grep -qa 'list_templates' target/release/clwd; then
            echo "::error::the release binary has no list_templates — the check would prove nothing"
            exit 1
          fi
          if grep -qa 'clwd_test_panic' target/release/clwd; then
            echo "::error::the release binary contains the test-only panicking tool"
            exit 1
          fi
          echo "ok: the release binary has no test-only tool"

      # The terminal-drawing dependencies are a feature, so this is the
      # assertion that the library half compiles without them.
      - name: library builds without terminal dependencies
        run: cargo build -p clwd-cli --lib --no-default-features

      # docs/spec defines bytes, down to whitespace inside code spans, and
      # docs/spec/fixtures are the conformance vector itself. A formatter that
      # reflows either surfaces later as a digest mismatch with no obvious
      # cause, so drift is caught here instead. A deliberate spec change
      # updates SHA256SUMS in the same commit.
      # Invariant: SC-7.
      - name: spec and fixtures have not drifted
        run: cd docs/spec && sha256sum -c SHA256SUMS

      # The control plane holds one `dyn Sandbox` and never branches on the
      # backend. That only holds if no backend type reaches the trait, so with
      # no features on, no backend crate may appear in the tree.
      - name: wasmtime types stay inside the wasm module
        run: |
          escaped=$(grep -rn --include='*.rs' -E '\bwasmtime[_a-z]*::' crates/runtime/src \
                    | grep -v '^crates/runtime/src/wasm/' || true)
          if [ -n "$escaped" ]; then
            echo "::error::a wasmtime type escaped the wasm module"
            echo "$escaped"
            exit 1
          fi
          echo "ok: wasmtime types confined to the wasm module"

      - name: no backend type reaches the Sandbox trait surface
        run: |
          if cargo tree -p clwd-runtime -e normal \
             | grep -qE 'wasmtime|wasi|hyper|firecracker|vsock|landlock|seccompiler'; then
            echo "::error::a backend type reached the Sandbox trait surface"
            cargo tree -p clwd-runtime -e normal
            exit 1
          fi
          echo "ok: no backend crate in the trait surface"

      # The trait must compile with both backends off.
      - name: trait surface builds with no backend
        run: cargo check -p clwd-runtime --no-default-features

      # The release binary, checksum-verified like gitleaks above, rather than
      # `cargo install`, which compiled it from source on every cache miss —
      # minutes of the gate spent building a linter.
      # Invariant: SC-4.
      - name: install cargo-deny
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$name.tar.gz"
          echo "${CARGO_DENY_SHA256}  $name.tar.gz" | sha256sum --check --strict
          tar -xzf "$name.tar.gz" "$name/cargo-deny"
          sudo install -m 0755 "$name/cargo-deny" /usr/local/bin/cargo-deny
          rm -rf "$name" "$name.tar.gz"
          cargo-deny --version

      # Invariant: SC-1.
      - name: deny
        run: cargo deny check --hide-inclusion-graph

  # The bundle format's whole promise is that the same tree produces the same
  # digest anywhere. Asserting that on one operating system asserts nothing:
  # macOS hands filenames to a process in NFD and Linux in NFC, which is
  # exactly the difference the canonicalization exists to erase. The fixture
  # digest is compared against the same constant on both legs.
  cross-platform-digest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p clwd-bundle

      # The library reads and writes bytes. If a runtime backend ever reaches
      # it, the platform builder acquires one too, across the repository seam.
      - name: clwd-bundle must not depend on wasmtime or a runtime
        run: |
          if cargo tree -p clwd-bundle -e normal | grep -qE 'wasmtime|tokio|clwd-runtime'; then
            echo "::error::clwd-bundle grew a runtime dependency"
            cargo tree -p clwd-bundle -e normal
            exit 1
          fi
          echo "ok: clwd-bundle has no runtime in its tree"

  # Neither backend is in `default`, so an ordinary workspace build never
  # compiles them. Without this job they rot silently.
  backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [wasm, microvm]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # One cache per matrix leg; the job id alone would collide.
          key: ${{ matrix.feature }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # microvm needs Linux with KVM at runtime; compiling it does not.
      - run: cargo build -p clwd-runtime --features ${{ matrix.feature }}

      # The wasm backend has tests; the default build never compiles them, so
      # `cargo test --workspace` in the gate job does not reach them.
      - name: test the wasm backend
        if: matrix.feature == 'wasm'
        run: cargo test -p clwd-runtime --features wasm

      # The backend conformance suite sits behind its own `conformance` feature
      # on top of `wasm`; the step above enables only `wasm`, so it never runs
      # the suite. Without this, the spec the suite encodes rots the way the
      # microVM arm's UNPROVEN line is meant to be a visible reminder against.
      - name: conformance suite
        if: matrix.feature == 'wasm'
        run: cargo test -p clwd-runtime --features conformance,wasm --test conformance

  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The guest fixture is outside the workspace and keeps its own target.
          workspaces: |
            . -> target
            crates/runtime/tests/fixtures/guest -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build sdk as a component
        run: cargo build -p clwd-sdk --target wasm32-wasip2

      # Installed through the pinned action rather than curled into /tmp. The
      # tarball was previously fetched over an unverified pipe and executed —
      # the same gap #67 closed for gitleaks — and #28 introduced a second
      # wasm-tools install in the gate job, so unifying on one mechanism also
      # removes the chance of the two drifting to different versions.
      - name: install wasm-tools
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: wasm-tools@1.257.1

      - name: wit parses standalone
        run: wasm-tools component wit crates/sdk/wit/

      # The fixture is `exclude`d from the workspace, so `cargo build
      # --workspace` and `just check` both skip it, and the conformance suite
      # runs against the committed `app.wasm` rather than a fresh build. A guest
      # that no longer compiles therefore leaves every one of those green — which
      # is exactly what happened while #34 was in flight.
      #
      # It matters more since #34 than before it: the guest used to depend only
      # on wit-bindgen and changed rarely, and now it depends on clwd-sdk, so any
      # SDK change can break it.
      # Templates are shipped product: an authoring agent reads them and
      # reproduces their habits into apps nobody reviews, so one that stops
      # compiling is a regression in what those apps look like.
      #
      # They are excluded from the workspace, so `cargo check --workspace` never
      # sees them — the same gap that let the guest fixture rot. Measured: the
      # first costs 34.7 s cold and each further one 1.5 s against a shared
      # target directory, because clwd-sdk and wit-bindgen compile once. Each
      # still builds independently from cold; the sharing is a cache, not a
      # dependency between them.
      - name: every template builds
        run: |
          set -euo pipefail
          for t in templates/*/; do
            name=$(basename "$t")
            echo "--- $name"
            (cd "$t" && cargo build --release --target wasm32-wasip2 --target-dir "$GITHUB_WORKSPACE/target/templates")
          done
          echo "ok: every template builds for wasm32-wasip2"

      - name: the guest fixture still builds against the SDK
        working-directory: crates/runtime/tests/fixtures/guest
        run: cargo build --release --target wasm32-wasip2

      # There is deliberately no "the committed app.wasm matches a fresh build"
      # step here. One was written and removed: this build is not byte
      # reproducible across machines, because rustc embeds source paths in panic
      # payloads, so the same source produces different bytes under
      # /home/runner than under a developer's home directory. Measured — two
      # builds of identical source from different absolute paths differ at byte
      # 4263 and still differ after `wasm-tools strip`, so the difference is in
      # the code section rather than in metadata that could be normalised away.
      #
      # Making it reproducible needs `--remap-path-prefix` wired through both
      # this job and `just rebuild-guest`, which is a build-configuration change
      # rather than a check. The guard that survives is the one above, and it is
      # the one that catches what actually went wrong: a fixture whose source
      # does not compile.

  # `clwd logs` must not carry a runtime backend. Asserted, not trusted.
  cli-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      # Until #25 the rule was "clwd-cli must never pull in wasmtime". `clwd run`
      # has to execute something, so the rule is now "only through the `run`
      # feature" — a narrower claim, and the only one that can still be true.
      #
      # Two assertions, because one no longer covers it. (A) is the original
      # property, unchanged apart from turning the feature off: an accidental
      # unconditional dependency still fails it. (B) is new, and exists so the
      # door is asserted to open — a feature gate nobody proves enables anything
      # rots into a no-op, and then (A) passes for the wrong reason.
      - name: the clwd-cli library carries no runtime without `run`
        run: |
          if cargo tree -p clwd-cli -e normal --no-default-features | grep -q wasmtime; then
            echo "::error::clwd-cli pulled in wasmtime without the run feature — a runtime backend must reach the CLI only through `run`"
            cargo tree -p clwd-cli -e normal --no-default-features | grep -B5 wasmtime
            exit 1
          fi
          echo "ok: no wasmtime in clwd-cli without the run feature"

      - name: the `run` feature does enable the runtime
        run: |
          if ! cargo tree -p clwd-cli -e normal --features run | grep -q wasmtime; then
            echo "::error::the run feature no longer pulls in a runtime — the gate above is passing for the wrong reason"
            exit 1
          fi
          echo "ok: the run feature enables wasmtime"

  # The guardrail. The control plane lives in a separate private repo; a path
  # or git dependency on it builds fine for whoever added it and breaks for
  # everyone else, while leaking private types into public crates. It fails
  # silently precisely because the author cannot reproduce the failure.
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: fresh

      - run: rustup show active-toolchain
        working-directory: fresh

      # The property is "does a dependency leave this repository", so the check
      # resolves each path and asks that, rather than counting `../` and hoping
      # depth stands in for direction. The regex this replaced got both cases
      # wrong: it failed a fixture four levels deep reaching a sibling crate
      # *inside* the repo, and it missed a root manifest escaping with a single
      # `../` — verified both ways before the swap.
      - name: no dependency may reference the private platform repo
        working-directory: fresh
        run: |
          set -uo pipefail
          root=$(pwd -P)
          fail=0

          # The private repo by name. No path resolution makes this acceptable.
          if grep -rn 'clwdrun/platform' --include=Cargo.toml . ; then
            echo "::error::a manifest references the private platform repo"
            fail=1
          fi

          while IFS= read -r hit; do
            manifest=${hit%%:*}
            rest=${hit#*:}
            dep=${rest#*\"}
            dep=${dep%%\"*}
            resolved=$(realpath -m "$(dirname "$manifest")/$dep")
            case "$resolved" in
              "$root" | "$root"/*) ;;
              *)
                echo "::error::$manifest: path dependency \"$dep\" resolves to $resolved, outside this repository"
                fail=1
                ;;
            esac
          done < <(grep -rn --include=Cargo.toml -oE 'path[[:space:]]*=[[:space:]]*"[^"]+"' . || true)

          [ "$fail" -eq 0 ] || exit 1
          echo "ok: no private-repo reference, and every path dependency stays inside the repository"

      # Isolated CARGO_HOME and no sibling checkouts: nothing on this runner can
      # satisfy a path dep that a developer machine would resolve locally.
      #
      # `check`, not `build`. What this job proves is that every dependency
      # resolves and every target type-checks from this clone alone; that needs
      # resolution and analysis, not code generation. The gate job's `test` step
      # builds and links the same commit, so a full build here only repeated it
      # without a cache.
      - name: check from a clean clone with isolated registry state
        working-directory: fresh
        env:
          CARGO_HOME: ${{ runner.temp }}/isolated-cargo
        run: cargo check --workspace --all-targets --locked

  # clwd-agent is musl-only and deliberately outside default-members, so
  # `cargo build --workspace` never touches it. Its own job, so a failure here
  # is attributable at a glance and does not mask a gate failure.
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - name: musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p clwd-agent --target x86_64-unknown-linux-musl

      - name: clwd-agent must stay out of default-members
        run: |
          if cargo metadata --no-deps --format-version 1 \
             | grep -q '"default_members".*clwd-agent'; then
            echo "::error::clwd-agent is back in default-members; it forces a musl toolchain on every contributor"
            exit 1
          fi
          echo "ok: clwd-agent excluded from default-members"
