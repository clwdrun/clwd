name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. No job here needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # Bump these two together. The digest is of
  # gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, taken from the release's own
  # checksums file and confirmed against the downloaded archive.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # Mirrors `just check`. If these two drift, the gate is a lie.
  gate:
    runs-on: ubuntu-latest
    steps:
      # Full history: the secret scan below walks every commit, and a shallow
      # clone would silently scan almost nothing.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # First, because it is seconds and a leaked credential invalidates
      # everything downstream. GitHub's own secret scanning and push protection
      # are Advanced Security features, unavailable on a private repository, so
      # this replaces them.
      #
      # Installed from the release tarball rather than via gitleaks-action,
      # which requires a paid licence key on organization accounts. A pinned
      # binary is also less supply chain than a third-party action, and runs
      # the identical command `just secrets` runs locally.
      #
      # Downloaded from the pinned release and checksum-verified before it is
      # unpacked. A secret scanner installed over an unverified pipe is a
      # supply-chain hole in the tool whose whole job is to close one: whatever
      # the download produced would run with sudo, against full history, and
      # report clean. `set -euo pipefail` so a failed download cannot fall
      # through to the next line.
      - name: install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" gitleaks
          gitleaks version

      - name: secrets
        run: gitleaks detect --no-banner --redact --exit-code 1

      # rustup honours rust-toolchain.toml on first invocation, installing the
      # pinned version with its profile, components and targets. No third-party
      # toolchain action needed — fewer actions is less supply chain in a repo
      # whose selling point is auditability.
      - run: rustup show active-toolchain

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          # Toolchain file in the key: a pin bump must invalidate rather than
          # resurrect artifacts built by the old compiler.
          key: ${{ runner.os }}-gate-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: test
        run: cargo test --workspace

      # The library half of clwd-cli must stay silent. `clwd mcp serve` (#32)
      # calls these functions in-process and emits nothing on stdout but
      # JSON-RPC; a stray print corrupts that stream intermittently, under load
      # only. main.rs is excluded because printing is precisely its job.
      - name: no print macro in the clwd-cli library surface
        run: |
          if grep -rn --include='*.rs' -E '\b(print!|println!|eprint!|eprintln!)' \
               crates/cli/src/lib.rs crates/cli/src/cli.rs \
               crates/cli/src/commands/ crates/cli/src/error.rs; then
            echo "::error::print macro in the clwd-cli library surface — see issue #14"
            exit 1
          fi
          echo "ok: no print macro in the clwd-cli library surface"

      # The terminal-drawing dependencies are a feature, so this is the
      # assertion that the library half compiles without them.
      - name: library builds without terminal dependencies
        run: cargo build -p clwd-cli --lib --no-default-features

      # docs/spec defines bytes, down to whitespace inside code spans, and
      # docs/spec/fixtures are the conformance vector itself. A formatter that
      # reflows either surfaces later as a digest mismatch with no obvious
      # cause, so drift is caught here instead. A deliberate spec change
      # updates SHA256SUMS in the same commit.
      - name: spec and fixtures have not drifted
        run: cd docs/spec && sha256sum -c SHA256SUMS

      # The control plane holds one `dyn Sandbox` and never branches on the
      # backend. That only holds if no backend type reaches the trait, so with
      # no features on, no backend crate may appear in the tree.
      - name: wasmtime types stay inside the wasm module
        run: |
          escaped=$(grep -rn --include='*.rs' -E '\bwasmtime[_a-z]*::' crates/runtime/src \
                    | grep -v '^crates/runtime/src/wasm/' || true)
          if [ -n "$escaped" ]; then
            echo "::error::a wasmtime type escaped the wasm module"
            echo "$escaped"
            exit 1
          fi
          echo "ok: wasmtime types confined to the wasm module"

      - name: no backend type reaches the Sandbox trait surface
        run: |
          if cargo tree -p clwd-runtime -e normal \
             | grep -qE 'wasmtime|wasi|hyper|firecracker|vsock|landlock|seccompiler'; then
            echo "::error::a backend type reached the Sandbox trait surface"
            cargo tree -p clwd-runtime -e normal
            exit 1
          fi
          echo "ok: no backend crate in the trait surface"

      # The trait must compile with both backends off.
      - name: trait surface builds with no backend
        run: cargo check -p clwd-runtime --no-default-features

      # `~/.cargo/bin` is in the cache, so on a warm cache the binary is already
      # there and a plain `cargo install` fails with "binary already exists".
      # That stayed hidden while every pull request added a dependency and so
      # got a fresh cache key; the first one that leaves Cargo.lock alone
      # restores main's cache and hits it. Reuse what the cache gave us.
      - name: install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --locked --version ^0.20
          fi
          cargo-deny --version

      - name: deny
        run: cargo deny check --hide-inclusion-graph

  # The bundle format's whole promise is that the same tree produces the same
  # digest anywhere. Asserting that on one operating system asserts nothing:
  # macOS hands filenames to a process in NFD and Linux in NFC, which is
  # exactly the difference the canonicalization exists to erase. The fixture
  # digest is compared against the same constant on both legs.
  cross-platform-digest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-bundle-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo test -p clwd-bundle

      # The library reads and writes bytes. If a runtime backend ever reaches
      # it, the platform builder acquires one too, across the repository seam.
      - name: clwd-bundle must not depend on wasmtime or a runtime
        run: |
          if cargo tree -p clwd-bundle -e normal | grep -qE 'wasmtime|tokio|clwd-runtime'; then
            echo "::error::clwd-bundle grew a runtime dependency"
            cargo tree -p clwd-bundle -e normal
            exit 1
          fi
          echo "ok: clwd-bundle has no runtime in its tree"

  # Neither backend is in `default`, so an ordinary workspace build never
  # compiles them. Without this job they rot silently.
  backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [wasm, microvm]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-backend-${{ matrix.feature }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # microvm needs Linux with KVM at runtime; compiling it does not.
      - run: cargo build -p clwd-runtime --features ${{ matrix.feature }}

      # The wasm backend has tests; the default build never compiles them, so
      # `cargo test --workspace` in the gate job does not reach them.
      - name: test the wasm backend
        if: matrix.feature == 'wasm'
        run: cargo test -p clwd-runtime --features wasm

      # The backend conformance suite sits behind its own `conformance` feature
      # on top of `wasm`; the step above enables only `wasm`, so it never runs
      # the suite. Without this, the spec the suite encodes rots the way the
      # microVM arm's UNPROVEN line is meant to be a visible reminder against.
      - name: conformance suite
        if: matrix.feature == 'wasm'
        run: cargo test -p clwd-runtime --features conformance,wasm --test conformance

  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-guest-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: build sdk as a component
        run: cargo build -p clwd-sdk --target wasm32-wasip2

      - name: wit parses standalone
        run: |
          WT=1.257.1
          curl -sSL -o /tmp/wt.tar.gz \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WT}/wasm-tools-${WT}-x86_64-linux.tar.gz"
          tar xzf /tmp/wt.tar.gz -C /tmp
          "/tmp/wasm-tools-${WT}-x86_64-linux/wasm-tools" component wit wit/

  # `clwd logs` must not carry a runtime backend. Asserted, not trusted.
  cli-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      # Until #25 the rule was "clwd-cli must never pull in wasmtime". `clwd run`
      # has to execute something, so the rule is now "only through the `run`
      # feature" — a narrower claim, and the only one that can still be true.
      #
      # Two assertions, because one no longer covers it. (A) is the original
      # property, unchanged apart from turning the feature off: an accidental
      # unconditional dependency still fails it. (B) is new, and exists so the
      # door is asserted to open — a feature gate nobody proves enables anything
      # rots into a no-op, and then (A) passes for the wrong reason.
      - name: the clwd-cli library carries no runtime without `run`
        run: |
          if cargo tree -p clwd-cli -e normal --no-default-features | grep -q wasmtime; then
            echo "::error::clwd-cli pulled in wasmtime without the run feature — a runtime backend must reach the CLI only through `run`"
            cargo tree -p clwd-cli -e normal --no-default-features | grep -B5 wasmtime
            exit 1
          fi
          echo "ok: no wasmtime in clwd-cli without the run feature"

      - name: the `run` feature does enable the runtime
        run: |
          if ! cargo tree -p clwd-cli -e normal --features run | grep -q wasmtime; then
            echo "::error::the run feature no longer pulls in a runtime — the gate above is passing for the wrong reason"
            exit 1
          fi
          echo "ok: the run feature enables wasmtime"

  # The guardrail. The control plane lives in a separate private repo; a path
  # or git dependency on it builds fine for whoever added it and breaks for
  # everyone else, while leaking private types into public crates. It fails
  # silently precisely because the author cannot reproduce the failure.
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: fresh

      - run: rustup show active-toolchain
        working-directory: fresh

      - name: no dependency may reference the private platform repo
        working-directory: fresh
        run: |
          if grep -rnE 'clwdrun/platform|path\s*=\s*"[^"]*\.\./\.\./' --include=Cargo.toml .; then
            echo "::error::a manifest references the private platform repo or escapes the workspace"
            exit 1
          fi
          echo "ok: no private-repo or workspace-escaping path dependency"

      # Isolated CARGO_HOME and no sibling checkouts: nothing on this runner can
      # satisfy a path dep that a developer machine would resolve locally.
      - name: build from a clean clone with isolated registry state
        working-directory: fresh
        env:
          CARGO_HOME: ${{ runner.temp }}/isolated-cargo
        run: cargo build --workspace --locked

  # clwd-agent is musl-only and deliberately outside default-members, so
  # `cargo build --workspace` never touches it. Its own job, so a failure here
  # is attributable at a glance and does not mask a gate failure.
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - name: musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-musl-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo build -p clwd-agent --target x86_64-unknown-linux-musl

      - name: clwd-agent must stay out of default-members
        run: |
          if cargo metadata --no-deps --format-version 1 \
             | grep -q '"default_members".*clwd-agent'; then
            echo "::error::clwd-agent is back in default-members; it forces a musl toolchain on every contributor"
            exit 1
          fi
          echo "ok: clwd-agent excluded from default-members"
